timing:
  min_green: 10
  max_green: 60
  yellow_duration: 3
  all_red_duration: 2
  startup_lost_time: 2.0
  headway: 2.0
  # Tuned aging bound: at <=20s the neglected phase is served promptly, so the
  # max-pressure (longest_queue_first) controller keeps waits bounded instead of
  # letting the busy phase starve the other. See scripts/sweep_aging.py.
  max_wait_threshold: 20
  # Discharge rate of a single approach during green (vehicles/hour).
  # Capacity per approach = saturation_flow * (green time / cycle time).
  saturation_flow: 1800
  # Seconds of the yellow interval during which vehicles still discharge.
  # Real intersections clear 1-2 vehicles on amber; the remainder of yellow
  # (yellow_duration - yellow_discharge_time) is clearance lost time.
  yellow_discharge_time: 2.0
  # Vehicles an approach can store before traffic spills back into the upstream
  # link. 25 ~= 175 m of queue at ~7 m per vehicle. Arrivals beyond this are
  # turned away and counted as blocked. Remove the key for unlimited storage.
  queue_capacity: 25

# Movement split of arriving vehicles, and what each movement costs in green.
# Ghana drives on the right, so a permitted left turn yields to opposing through
# traffic and discharges well below saturation flow; a right turn is only mildly
# slowed. Adjustments are HCM-style saturation-flow factors in (0, 1].
# Effective flow here = 1800 * (0.70 + 0.15*0.45 + 0.15*0.85) = 1611 veh/h.
turning:
  through: 0.70
  left: 0.15
  right: 0.15
  left_adjustment: 0.45
  right_adjustment: 0.85

queue_clearing:
  short_queue_threshold: 5
  short_queue_green: 15
  long_queue_min_green: 20
  long_queue_max_green: 60

# Emergency-vehicle preemption. Remove this whole block (or set enabled: false)
# and the model behaves exactly as it did before preemption existed — no EVs are
# generated and no controller is wrapped. That fallback is pinned by tests.
emergency:
  enabled: true
  # EV arrivals per approach (vehicles/second), on top of ordinary demand.
  # 0.002 ~= one EV every 8 minutes per approach; over a 600 s run that is
  # ~5 EVs across the junction — frequent enough to measure, rare enough that
  # preemption does not dominate the signal plan.
  arrival_rate: 0.002
  # Safety floor: an in-progress green must run at least this long before
  # preemption may truncate it. Real EVP controllers honour minimum green
  # rather than dropping a green instantly. Set to 0 for instant preemption.
  min_green_before_preempt: 5.0
  # Hard cap on a preemption green, in case an EV somehow never clears.
  max_preempt_green: 45.0
  # Seconds the preempted phase is held green after the last EV departs, so the
  # EV is clear of the intersection before normal control resumes.
  clearance_extension: 3.0

# Preemptive scheduling (the SRTF counterpart to the non-preemptive
# controllers). When enabled, the active controller's selection rule is re-run
# every tick and the green is cut short the moment it prefers the other phase,
# instead of only deciding at phase boundaries.
#
# OFF by default, and deliberately so: this is the knob for the "does
# preemption help ordinary traffic the way it helps emergency vehicles?"
# experiment, not part of the headline results. Leaving it false reproduces
# every number in the README exactly.
preemptive:
  enabled: false
  # A green must run at least this long before it can be preempted — the
  # scheduling quantum's floor, and the same safety idea as the emergency
  # tier's min_green_before_preempt.
  min_service_before_preempt: 5.0
  # The rival phase must be ahead by this many vehicles, not merely tied.
  # Hysteresis: without it a single arrival triggers a switch that costs a full
  # yellow + all-red to make.
  margin_vehicles: 0

# Unsaturated demand: every approach stays below capacity, so adaptive control
# has spare green to reallocate and can actually help. Rates are 30% of
# default_config.yaml. The peak approach (0.21 veh/s) sits under the effective
# per-approach capacity of ~0.22 veh/s (1611 veh/h effective flow x a green
# share of ~0.49), which the `blocked` metric confirms: 0% blocked on every
# scenario. Raising these much further pushes the rush scenarios into
# spillback and the comparison stops being about green allocation.
scenarios:
  balanced:
    north: 0.09
    south: 0.09
    east: 0.09
    west: 0.09
  morning_rush:
    north: 0.15
    south: 0.06
    east: 0.18
    west: 0.03
  evening_rush:
    north: 0.06
    south: 0.15
    east: 0.03
    west: 0.18
  asymmetric:
    north: 0.21
    south: 0.03
    east: 0.12
    west: 0.06

detection:
  vehicle_classes: [1, 2, 3, 5, 7]
  confidence_threshold: 0.4
  model: "yolov8n.pt"
  frame_skip: 2
  # ColorDetector (synthetic video) thresholds
  color_min_area: 400
  color_min_saturation: 50
  color_min_value: 55
  # EmergencyClassifier. COCO has no ambulance class, so an EV is identified by
  # its light bar: saturated red and saturated blue that are each a small share
  # of the vehicle AND present in comparable amounts. A blue car with red tail
  # lights fails the balance test; that false positive is what these three
  # thresholds exist to stop. Heuristic, not a trained classifier — see
  # README > Known limitations.
  emergency_min_lightbar_fraction: 0.015   # both colours genuinely present
  emergency_max_lightbar_fraction: 0.35    # neither is the paintwork
  emergency_min_lightbar_balance: 0.35     # areas within ~3x of each other
  # Red and blue must also form ONE compact fixture: the bounding box of all
  # light-bar pixels may cover at most this share of the vehicle. A bus with
  # blue-tinted glazing down its flanks and red tail lights across the rear is
  # balanced but spread over the whole body, and this is what rejects it.
  emergency_max_fixture_extent: 0.40
  emergency_min_saturation: 90
  emergency_min_value: 90
  # Fraction of the bbox height, measured from the top, searched for the bar.
  # 1.0 searches the whole box — correct for the top-down synthetic view, and
  # safe generally since ordinary vehicles rarely show saturated red AND blue.
  # Lower it to ~0.5 for oblique CCTV footage to look only at the roof line.
  emergency_lightbar_band: 1.0

visualization:
  window_width: 1280
  window_height: 720
  fps: 30
  colors:
    red: [255, 0, 0]
    green: [0, 255, 0]
    yellow: [255, 255, 0]
    background: [30, 30, 30]
    text: [255, 255, 255]
    bar_ns: [0, 150, 255]
    bar_ew: [255, 150, 0]
    roi_overlay: [0, 255, 100]

metrics:
  export_dir: "results/low_load"
  csv_prefix: "traffic_metrics"
  statistical_trials: 10
